<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buy cool new product</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <script src="https://js.stripe.com/v3/"></script>
    <style>
      .container-left, .container-right {
        padding: 20px;
        align-items: center;
        justify-content: center;
        text-align: center;
      }
      .product img {
        max-width: 20%; /* Set a max-width of 80% of the container */
        height: auto;
      }
      .product {
        margin-bottom: 20px;
      }
      .checkout-button {
        margin-top: 10px;
      }
    </style>
  </head>
  <body>
    <div class="container-fluid">
      <div class="row">
        <!-- Left container for the product list -->
        <div class="col-md-6 container-left">
          {% for item in data %}
            <div class="product">
              <img src="{{ item['Temp URL'] }}" alt="Image of the product" class="img-fluid"/>
              <div class="description">
                <h3>{{ item['Name'] }}</h3>
                <h5>{{ item['Price'] }}</h5>
              </div>
            </div>
            <!-- <form action="/create-checkout-session/{{ item['Reference'] }}/checkout" method="POST">
              <button type="submit" id="checkout-button" class="btn btn-primary checkout-button">Checkout</button>
            </form> -->
          {% endfor %}
        </div>

        <!-- Right container for the checkout form -->
        <div class="col-md-6 container-right">
          <div class="py-5 text-center">
            <h2>Checkout</h2>
            <p class="lead">Please fill out the form below</p>
          </div>

          <div class="container">
            <h4 class="mb-3">Billing Address</h4>
            <form novalidate>
              <div class="row">
                <div class="col-sm-6">
                  <label for="firstName">First name</label>
                  <input id="firstName" type="text" class="form-control" placeholder="First name required" required>
                  <div class="invalid-feedback">
                    Valid first name is required.
                  </div>
                </div>
              </div>

              <div class="row">
                <div class="col-sm-6">
                  <label for="lastName">Last name</label>
                  <input id="lastName" type="text" class="form-control" placeholder="Last name required" required>
                  <div class="invalid-feedback">
                    Valid last name is required.
                  </div>
                </div>
              </div>

              <div class="row">
                <div class="col-sm-6">
                  <label for="email">Email</label>
                  <input id="email" type="text" class="form-control" placeholder="Email required" required>
                  <div class="invalid-feedback">
                    Valid Email is required.
                  </div>
                </div>
              </div>

              <div class="row">
                <div class="col-sm-6">
                  <label for="Address"></label>
                  <input id="address" type="text" class="form-control" placeholder="address required" required>
                  <div class="invalid-feedback">
                    Valid address is required.
                  </div>
                </div>
              </div>
              <div>
                <butto type="submit" id="checkout-button" class="btn btn-primary checkout-button">Check Out</button>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>

    <!-- Bootstrap JS (Optional for interactivity like modals or dropdowns) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
